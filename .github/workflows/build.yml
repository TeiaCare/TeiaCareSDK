name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      force_deployment:
        description: 'Force Conan package deploy'
        required: true
        default: true
        type: boolean

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: ['Debug', 'Release', 'RelWithDebInfo']
        config:
          - name: windows2022_msvc2022
            os: windows-2022
            profile: .ci/profiles/windows-msvc-2022
            setup_build_env: 'call "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"'
            activate_venv: 'call ".venv\\Scripts\\activate.bat"'

          - name: macos14_clang15
            os: macos-14
            profile: .ci/profiles/macos-arm64-clang15
            setup_build_env: ""
            activate_venv: 'source .venv/bin/activate'

          - name: ubuntu2204_gcc12
            os: ubuntu-22.04
            profile: .ci/profiles/linux-gcc-12
            setup_build_env: ""
            activate_venv: 'source .venv/bin/activate'

          - name: ubuntu2204_clang15
            os: ubuntu-22.04
            profile: .ci/profiles/linux-clang-15
            setup_build_env: ""
            activate_venv: 'source .venv/bin/activate'

    runs-on: ${{ matrix.config.os }}
    name: CI ${{ matrix.config.name }} ${{ matrix.build_type }}

    steps:
      # Check out the same bytes on every OS: with CRLF conversion the Windows
      # jobs export a recipe with different line endings, i.e. a different
      # recipe revision from the Linux and macOS jobs of the same release.
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      # Third-party Conan 2 packages come from teiacare_conan2; teiacare serves only
      # the TeiaCare libraries (it also holds Conan 1 recipes, revision 0).
      - name: Setup Virtual Environment
        uses: ./.github/actions/shell
        with:
          commands: |
            python3 -m venv .venv
            ${{ matrix.config.activate_venv }}
            pip3 install -r scripts/scripts/requirements.txt
            conan remote add teiacare_conan2 ${{ secrets.ARTIFACTORY_URL }}/teiacare_conan2 --index 0 --force
            conan remote add teiacare ${{ secrets.ARTIFACTORY_URL }}/teiacare --index 1 --force --allowed-packages "teiacare_*/*"
            conan remote login teiacare_conan2 ${{ secrets.ARTIFACTORY_USERNAME }} -p ${{ secrets.ARTIFACTORY_PASSWORD }}
            conan remote login teiacare ${{ secrets.ARTIFACTORY_USERNAME }} -p ${{ secrets.ARTIFACTORY_PASSWORD }}
        env:
          CONAN_HOME: ${{ github.workspace }}/.conan2

      - name: Build
        uses: ./.github/actions/shell
        with:
          commands: |
            ${{ matrix.config.activate_venv }}
            ${{ matrix.config.setup_build_env }}
            conan install sdk/examples --output-folder build/modules --settings build_type=${{ matrix.build_type }} --profile:all ${{ matrix.config.profile }} --build missing
            conan install sdk/tests --output-folder build/modules --settings build_type=${{ matrix.build_type }} --profile:all ${{ matrix.config.profile }} --build missing
            cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_TOOLCHAIN_FILE=build/modules/conan_toolchain.cmake -DTC_ENABLE_WARNINGS_ERROR=True -B build/${{ matrix.build_type }} -S . --fresh
            cmake --build build/${{ matrix.build_type }}
            cmake --install build/${{ matrix.build_type }} --prefix install
        env:
          CONAN_HOME: ${{ github.workspace }}/.conan2

      - name: Unit Tests
        uses: ./.github/actions/shell
        with:
          commands: |
            ${{ matrix.config.activate_venv }}
            ${{ matrix.config.setup_build_env }}
            conan install sdk/tests --output-folder build/modules --settings build_type=${{ matrix.build_type }} --profile:all ${{ matrix.config.profile }} --build missing
            cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_TOOLCHAIN_FILE=build/modules/conan_toolchain.cmake -DTC_ENABLE_WARNINGS_ERROR=True -DTC_ENABLE_UNIT_TESTS=True -B build/${{ matrix.build_type }} -S . --fresh
            cmake --build build/${{ matrix.build_type }}
            cmake --install build/${{ matrix.build_type }} --prefix install
            python3 scripts/tools/run_unit_tests.py ${{ matrix.build_type }}
        env:
          CONAN_HOME: ${{ github.workspace }}/.conan2
        continue-on-error: true
        timeout-minutes: 5

      - name: Create Conan Package
        uses: ./.github/actions/shell
        with:
          commands: |
            ${{ matrix.config.activate_venv }}
            ${{ matrix.config.setup_build_env }}
            conan create . --settings build_type=${{ matrix.build_type }} --profile:all ${{ matrix.config.profile }} --build missing
        env:
          CONAN_HOME: ${{ github.workspace }}/.conan2

      - name: Publish Conan cache
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }}-${{ matrix.build_type }}
          path: .conan2
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true

  coverage:
    needs: build
    runs-on: ubuntu-22.04
    name: Code Coverage

    env:
      COMPILER: gcc
      COMPILER_VERSION: 12
      PROFILE: .ci/profiles/linux-gcc-12
      BUILD_TYPE: Debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      # Third-party Conan 2 packages come from teiacare_conan2; teiacare serves only
      # the TeiaCare libraries (it also holds Conan 1 recipes, revision 0).
      - name: Setup Virtual Environment
        uses: ./.github/actions/shell
        with:
          commands: |
            python3 -m venv .venv
            source .venv/bin/activate
            pip3 install -r scripts/scripts/requirements.txt
            conan remote add teiacare_conan2 ${{ secrets.ARTIFACTORY_URL }}/teiacare_conan2 --index 0 --force
            conan remote add teiacare ${{ secrets.ARTIFACTORY_URL }}/teiacare --index 1 --force --allowed-packages "teiacare_*/*"
            conan remote login teiacare_conan2 ${{ secrets.ARTIFACTORY_USERNAME }} -p ${{ secrets.ARTIFACTORY_PASSWORD }}
            conan remote login teiacare ${{ secrets.ARTIFACTORY_USERNAME }} -p ${{ secrets.ARTIFACTORY_PASSWORD }}
        env:
          CONAN_HOME: ${{ github.workspace }}/.conan2

      - name: Run Code Coverage
        run: |
          source .venv/bin/activate
          conan install sdk/tests --output-folder build/modules --settings build_type=${{ env.BUILD_TYPE }} --profile:all ${{ env.PROFILE }} --build missing
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_TOOLCHAIN_FILE=build/modules/conan_toolchain.cmake -DTC_ENABLE_WARNINGS_ERROR=True -DTC_ENABLE_UNIT_TESTS=True -DTC_ENABLE_UNIT_TESTS_COVERAGE=True -DTC_ENABLE_EXAMPLES=False -B build/${{ env.BUILD_TYPE }} -S . --fresh
          cmake --build build/${{ env.BUILD_TYPE }}
          cmake --install build/${{ env.BUILD_TYPE }} --prefix install
          python3 scripts/tools/run_unit_tests.py ${{ env.BUILD_TYPE }}
          python3 scripts/tools/run_coverage.py ${{ env.COMPILER }} ${{ env.COMPILER_VERSION }} sdk --extra_args=-e=sdk/src/datetime/date.h
        timeout-minutes: 5
        env:
          CONAN_HOME: ${{ github.workspace }}/.conan2

      - name: Upload Codacy
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r results/coverage/cobertura.xml
        env:
         CODACY_PROJECT_TOKEN: ${{secrets.CODACY_PROJECT_TOKEN}}

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_deployment == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        build_type: ['Debug', 'Release', 'RelWithDebInfo']
        config:
          - name: windows2022_msvc2022
            os: windows-2022
            setup_build_env: 'call "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"'
            activate_venv: 'call ".venv\\Scripts\\activate.bat"'

          - name: macos14_clang15
            os: macos-14
            setup_build_env: ""
            activate_venv: 'source .venv/bin/activate'

          - name: ubuntu2204_gcc12
            os: ubuntu-22.04
            setup_build_env: ""
            activate_venv: 'source .venv/bin/activate'

          - name: ubuntu2204_clang15
            os: ubuntu-22.04
            setup_build_env: ""
            activate_venv: 'source .venv/bin/activate'

    runs-on: ${{ matrix.config.os }}
    name: CD ${{ matrix.config.name }} ${{ matrix.build_type }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Setup Virtual Environment
        uses: ./.github/actions/shell
        with:
          commands: |
            python3 -m venv .venv
            ${{ matrix.config.activate_venv }}
            pip3 install -r scripts/scripts/requirements.txt
        env:
          CONAN_HOME: ${{ github.workspace }}/.conan2

      - name: Download Conan cache
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.config.name }}-${{ matrix.build_type }}
          path: .conan2/

      # The cache artifact overwrites remotes.json, so the remote must
      # be configured after the download, not in the setup step.
      # Upload ONLY this package: the cache holds just the version built by this run.
      # Commands run in cmd.exe on Windows: no '#' lines and no $(...) inside them.
      # Never upload "*": the cache also contains Conan 2 builds of
      # shared references (fmt, zlib, ...) and new revisions on the
      # teiacare remote break the Conan 1 projects that consume it.
      - name: Upload Conan Package
        uses: ./.github/actions/shell
        with:
          commands: |
            ${{ matrix.config.activate_venv }}
            ${{ matrix.config.setup_build_env }}
            conan remote add teiacare ${{ secrets.ARTIFACTORY_URL }}/teiacare --index 0 --force
            conan remote login teiacare ${{ secrets.ARTIFACTORY_USERNAME }} -p ${{ secrets.ARTIFACTORY_PASSWORD }}
            conan upload "teiacare_sdk/*" --remote teiacare --confirm
        env:
          CONAN_HOME: ${{ github.workspace }}/.conan2
